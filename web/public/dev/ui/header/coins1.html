<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox • Header (Coins)</title>
  <style>
    /* Inputs:
       - Font: ../buttons/assets/LilitaOne-Regular.ttf
       - Coin icon: ./assets/ResourceBar_Icon_Gold.png
       - Bar color: #270E0C (dark red-brown)
    */
    @font-face {
      font-family: 'Lilita One';
      src: url('../buttons/assets/LilitaOne-Regular.ttf') format('truetype');
      font-display: swap;
    }

    html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; color: #fff; }
    .screen { min-height: 100%; display: grid; place-items: center; padding: 24px; }

    .wrap { width: 50%; max-width: 420px; }

    .coinsBar {
      position: relative; /* anchor */
      background: #270E0C;
      border-radius: 22px;
      min-height: 36px;
      --icon-size: clamp(44px, 20vw, 600px);
      padding: 8px 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.35);
    }

    .coinsText {
      position: absolute; 
      left: 20px; 
      right: 20px; /* right margin + icon + gap */
      top: 50%; 
      transform: translateY(-50%);
      font-family: 'Lilita One', sans-serif;
      font-size: clamp(28px, 6vw, 40px);
      color: #ffffff;
      line-height: 1;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .coinIcon {
      position: absolute; right: -24px; top: 50%; transform: translateY(-50%);
      width: var(--icon-size); height: var(--icon-size);
      background: url('./assets/ResourceBar_Icon_Gold.png') center/contain no-repeat;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
      pointer-events: none;
    }

    .note { margin-top: 10px; font-size: 12px; opacity: 0.8; text-align: center; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="wrap">
      <div class="coinsBar">
        <div class="coinsText">9,999</div>
        <div class="coinIcon" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</body>
</html>
